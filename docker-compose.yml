name: fuisic

x-app: &app
    build:
        context: .
        dockerfile: docker/app/Dockerfile
    image: fuisic-back:dev
    volumes:
        - '.:/var/www/html'
        # composer path repository "../fuisic-auth"
        - '../fuisic-auth:/var/www/fuisic-auth:ro'
    networks:
        - fuisic

services:
    app:
        <<: *app
        depends_on:
            pgsql:
                condition: service_healthy
            redis:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
            minio:
                condition: service_started

    queue:
        <<: *app
        command: php artisan queue:work rabbitmq --queue=auth.notifications,default --sleep=3 --tries=3 --max-time=3600
        depends_on:
            app:
                condition: service_started
            rabbitmq:
                condition: service_healthy
            pgsql:
                condition: service_healthy
        restart: unless-stopped

    nginx:
        image: nginx:1.30-alpine
        ports:
            - '${APP_PORT:-8080}:80'
        volumes:
            - '.:/var/www/html:ro'
            - './docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro'
        networks:
            - fuisic
        depends_on:
            - app

    front:
        profiles:
            - front
        build:
            context: ../fuisic-front
        image: fuisic-front:dev
        ports:
            - '${FORWARD_FRONT_PORT:-8081}:8081'
        volumes:
            - '../fuisic-front:/app'
            - '/app/node_modules'
        networks:
            - fuisic
        depends_on:
            - nginx

    pgsql:
        image: postgres:15
        ports:
            - '${FORWARD_DB_PORT:-5432}:5432'
        environment:
            PGPASSWORD: '${DB_PASSWORD:-secret}'
            POSTGRES_DB: '${DB_DATABASE}'
            POSTGRES_USER: '${DB_USERNAME}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
        volumes:
            - pgsql_data:/var/lib/postgresql/data
            - './docker/pgsql/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql:ro'
        networks:
            - fuisic
        healthcheck:
            test: ['CMD', 'pg_isready', '-q', '-d', '${DB_DATABASE}', '-U', '${DB_USERNAME}']
            retries: 3
            timeout: 5s

    redis:
        image: redis:8-alpine
        ports:
            - '${FORWARD_REDIS_PORT:-6380}:6379'
        volumes:
            - redis_data:/data
        networks:
            - fuisic
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            retries: 3
            timeout: 5s

    rabbitmq:
        image: rabbitmq:3-management-alpine
        ports:
            - '${FORWARD_RABBITMQ_PORT:-5672}:5672'
            - '${FORWARD_RABBITMQ_DASHBOARD_PORT:-15672}:15672'
        environment:
            RABBITMQ_DEFAULT_USER: '${RABBITMQ_USER:-guest}'
            RABBITMQ_DEFAULT_PASS: '${RABBITMQ_PASSWORD:-guest}'
        volumes:
            - rabbitmq_data:/var/lib/rabbitmq
        networks:
            - fuisic
        healthcheck:
            test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
            retries: 3
            timeout: 5s

    mailpit:
        image: axllent/mailpit:v1.31
        ports:
            - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
            - '${FORWARD_MAILPIT_SMTP_PORT:-1025}:1025'
        networks:
            - fuisic

    # Официальные образы MinIO больше не публикуются — используем совместимый форк pgsty.
    minio:
        image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
        command: server /data --console-address ":9001"
        environment:
            MINIO_ROOT_USER: '${MINIO_ROOT_USER:-fuisic}'
            MINIO_ROOT_PASSWORD: '${MINIO_ROOT_PASSWORD:-fuisicsecret}'
        ports:
            - '${FORWARD_MINIO_PORT:-9000}:9000'
            - '${FORWARD_MINIO_CONSOLE_PORT:-9001}:9001'
        volumes:
            - minio_data:/data
        networks:
            - fuisic

    minio-init:
        image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
        depends_on:
            - minio
        networks:
            - fuisic
        entrypoint: >
            /bin/sh -c "
            i=0;
            until mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}; do
              i=$$((i+1));
              if [ $$i -gt 20 ]; then exit 1; fi;
              sleep 2;
            done;
            mc mb --ignore-existing local/$${AWS_BUCKET};
            mc anonymous set download local/$${AWS_BUCKET};
            "
        environment:
            MINIO_ROOT_USER: '${MINIO_ROOT_USER:-fuisic}'
            MINIO_ROOT_PASSWORD: '${MINIO_ROOT_PASSWORD:-fuisicsecret}'
            AWS_BUCKET: '${AWS_BUCKET:-fuisic}'

volumes:
    pgsql_data:
    redis_data:
    rabbitmq_data:
    minio_data:

networks:
    fuisic:
