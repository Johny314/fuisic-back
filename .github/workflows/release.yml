name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Открывает/обновляет PR «chore(main): release X.Y.Z» по conventional commits;
      # после его merge создаёт тег и GitHub Release.
      - uses: googleapis/release-please-action@v5
        id: release

      # CI на релизном PR (его открывает GITHUB_TOKEN) GitHub ставит в action_required —
      # ждёт одобрения. Одобряем эти прогоны, иначе обязательные проверки не появятся.
      - name: Approve CI runs on release PRs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branches=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --label "autorelease: pending" \
            --json headRefName --jq '.[].headRefName')
          [ -z "$branches" ] && exit 0
          for _ in $(seq 1 12); do
            approved=0
            for branch in $branches; do
              for id in $(gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=$branch&event=pull_request&status=action_required" \
                  --jq '.workflow_runs[].id'); do
                gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/approve" && approved=1
                echo "approved run $id on $branch"
              done
            done
            [ "$approved" = 1 ] && exit 0
            sleep 5
          done
          echo "no runs waiting for approval"
