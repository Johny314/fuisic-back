name: Баг
description: Что-то работает не так, как должно
labels: [bug]
projects: ["Johny314/3"]
body:
  - type: textarea
    id: actual
    attributes:
      label: Что происходит
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Как воспроизвести
      value: |
        1. 
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Как должно быть
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Где
      multiple: true
      options: [Web, iOS, Android, API, Админка]
  - type: textarea
    id: logs
    attributes:
      label: Логи, скриншоты, версия
